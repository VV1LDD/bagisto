# No Reverb/Pusher/TURN vars here. If Coolify still injects them, delete those keys
# in the service Environment tab — they are not removed by redeploying this file alone.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    container_name: bagisto-app
    environment:
      APP_NAME: "${APP_NAME:-Bagisto}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL}"
      APP_ADMIN_DOMAIN: "${APP_ADMIN_DOMAIN}"
      APP_ADMIN_URL_FULL: "${SERVICE_FQDN_ADMIN:-https://timebeing.meanly.ru}"
      APP_ADMIN_URL: "${APP_ADMIN_URL:-admin}"
      DB_CONNECTION: mysql
      DB_HOST: "${DB_HOST:-mysql}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-bagisto}"
      DB_USERNAME: "${DB_USERNAME:-bagisto}"
      DB_PASSWORD: "${DB_PASSWORD:-password}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redispassword}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      MAIL_MAILER: "${MAIL_MAILER:-smtp}"
      MAIL_HOST: "${MAIL_HOST:-mailpit}"
      MAIL_PORT: "${MAIL_PORT:-1025}"
      SCOUT_DRIVER: "${SCOUT_DRIVER:-database}"
      ELASTICSEARCH_HOST: "${ELASTICSEARCH_HOST:-elasticsearch}"
      SESSION_DRIVER: "${SESSION_DRIVER:-redis}"
      CACHE_DRIVER: "${CACHE_DRIVER:-redis}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-redis}"
      BROADCAST_CONNECTION: "${BROADCAST_CONNECTION:-log}"
      ALCHEMY_RPC_URL: "${ALCHEMY_RPC_URL}"
      ADMIN_ETH_PRIVATE_KEY: "${ADMIN_ETH_PRIVATE_KEY}"
      MINT_CONTRACT_ADDRESS: "${MINT_CONTRACT_ADDRESS}"
    expose:
      - "80"
    networks:
      - bagisto-network
      - coolify
    volumes:
      - 'bagisto-storage:/var/www/html/storage'
    depends_on:
      - elasticsearch
      - mailpit

  admin:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    container_name: bagisto-admin
    environment:
      APP_NAME: "${APP_NAME:-Bagisto} (Admin)"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${SERVICE_FQDN_ADMIN:-https://timebeing.meanly.ru}"
      APP_ADMIN_DOMAIN: "${APP_ADMIN_DOMAIN:-${SERVICE_FQDN_ADMIN}}"
      APP_ADMIN_URL_FULL: "${SERVICE_FQDN_ADMIN:-https://timebeing.meanly.ru}"
      APP_ADMIN_URL: "" # Root access on the admin domain
      DB_CONNECTION: mysql
      DB_HOST: "${DB_HOST:-mysql}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-bagisto}"
      DB_USERNAME: "${DB_USERNAME:-bagisto}"
      DB_PASSWORD: "${DB_PASSWORD:-password}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redispassword}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      MAIL_MAILER: "${MAIL_MAILER:-smtp}"
      MAIL_HOST: "${MAIL_HOST:-mailpit}"
      MAIL_PORT: "${MAIL_PORT:-1025}"
      SCOUT_DRIVER: "${SCOUT_DRIVER:-database}"
      ELASTICSEARCH_HOST: "${ELASTICSEARCH_HOST:-elasticsearch}"
      SESSION_DRIVER: "${SESSION_DRIVER:-redis}"
      CACHE_DRIVER: "${CACHE_DRIVER:-redis}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-redis}"
      BROADCAST_CONNECTION: "${BROADCAST_CONNECTION:-log}"
      ALCHEMY_RPC_URL: "${ALCHEMY_RPC_URL}"
      ADMIN_ETH_PRIVATE_KEY: "${ADMIN_ETH_PRIVATE_KEY}"
      MINT_CONTRACT_ADDRESS: "${MINT_CONTRACT_ADDRESS}"
    expose:
      - "80"
    networks:
      - bagisto-network
      - coolify
    volumes:
      - 'bagisto-storage:/var/www/html/storage'
    depends_on:
      - elasticsearch
      - mailpit

  elasticsearch:
    image: 'docker.elastic.co/elasticsearch/elasticsearch:7.17.0'
    container_name: bagisto-elasticsearch
    restart: always
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - 'bagisto-elasticsearch-data:/usr/share/elasticsearch/data'
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 24 # 24 * 10s = 4 minutes max boot time
    networks:
      - bagisto-network

  mailpit:
    image: 'axllent/mailpit:latest'
    container_name: bagisto-mailpit
    restart: always
    ports:
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
    networks:
      - bagisto-network



networks:
  bagisto-network:
    driver: bridge
  coolify:
    external: true

volumes:

  bagisto-elasticsearch-data:
    driver: local
  bagisto-storage:
    driver: local

